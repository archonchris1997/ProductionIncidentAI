name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProductionIncidentAI.slnx

      - name: Build
        run: dotnet build ProductionIncidentAI.slnx --no-restore -c Release

      - name: Unit, workflow, agent evals and API tests
        run: >
          dotnet test ProductionIncidentAI.slnx --no-build -c Release
          --filter "FullyQualifiedName!~ProductionIncident.RegressionEvals"

      # Release gate: any change to prompts, skills, model or workflow must keep the regression evals green.
      - name: Regression evals + release gate
        run: dotnet test tests/ProductionIncident.RegressionEvals --no-build -c Release --logger "console;verbosity=detailed"
